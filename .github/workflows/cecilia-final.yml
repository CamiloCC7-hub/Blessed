name: Compilar y publicar Cecilia
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'avance-final/**'
      - 'assets/cecilia-logo.webp'
      - '.github/workflows/cecilia-final.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: cecilia-final-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compilar SPA
        working-directory: avance-final
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publicar distribución en Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p entrega-final
          rsync -a --delete avance-final/dist/ entrega-final/
          git add entrega-final avance-final/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publicar compilación de Cecilia Restaurante"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
